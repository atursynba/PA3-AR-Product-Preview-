<!DOCTYPE html>
<html lang="en">
<head>

  <title>PA3 – AR Hit-Testing – 243121</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; background: #000; color: #fff; }

  <!-- Импорт-мап для строго фиксированной версии Three.js 0.186.1 -->

      "imports": {

        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="header">
    <h2 style="margin:0 0 5px 0; font-size:16px;">AR Product Preview (ID: 243121)</h2>
